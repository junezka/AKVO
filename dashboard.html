<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Diagnóstico</title>
    <link rel="stylesheet" href="../styles/style.css">
    <!-- Cargar librería Chart.js para el gráfico de radar -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <span class="badge">Diagnóstico completado</span>
            <h1>Tu informe de situación empresarial</h1>
        </header>

        <div class="grid-layout">
            <!-- Tarjeta 1: Puntuación -->
            <div class="card">
                <h3>ÍNDICE DE MADUREZ EMPRESARIAL H²</h3>
                <div class="score-display">
                    <span class="score-number" id="finalScore">0</span>
                    <span class="score-total">/100</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="scoreProgress"></div>
                </div>
                <span class="level-badge" id="levelText">Nivel: Calculando...</span>
                <p id="feedbackText">Completando análisis...</p>
            </div>

            <!-- Tarjeta 2: Gráfico -->
            <div class="card">
                <h3>PERFIL DE MADUREZ POR ÁREA</h3>
                <div class="chart-container">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
        <div class="areas-section">
    <h2>Diagnóstico por área</h2>
    <div id="areasContainer" class="areas-container">
        <!-- Las tarjetas se insertarán aquí con JavaScript -->
    </div>
</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
